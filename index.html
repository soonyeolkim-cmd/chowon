<style>
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0f1a0f;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; position: fixed; left: 0; top: 0; touch-action: none; image-rendering: pixelated; }
</style>
<script>window.BUILD_V='mvcgmmkt';fetch('version.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{if(d.v===window.BUILD_V)return;try{if(sessionStorage.getItem('reloadV')===d.v)return;sessionStorage.setItem('reloadV',d.v);}catch(_){}const u=new URL(location.href);u.searchParams.set('r',d.v);location.replace(u.href);}).catch(()=>{});</script>
