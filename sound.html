<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>봉인의 숲 사운드 테스트</title>
<style>
  /* 게임과 같은 효과음 코드(js/sfx.js)를 그대로 불러서 버튼으로 들어 보는 페이지 (2026-10-23) */
  @font-face { font-family: 'AlkiFairy'; src: url('assets/fonts/AlkiFairy-Bold.woff2') format('woff2'); font-weight: 700; }
  @font-face { font-family: 'AlkiFairy'; src: url('assets/fonts/AlkiFairy-Medium.woff2') format('woff2'); font-weight: 500; }
  :root { --bg: #0f1a0f; --panel: #1a2620; --line: #2e3d33; --fg: #eef2ea; --dim: #9fb0a3; --accent: #ffd24a; --purple: #a874ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 500 15px/1.5 "AlkiFairy", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px; }
  main { max-width: 820px; margin: 0 auto; }
  h1 { font-weight: 700; font-size: 26px; margin: 20px 0 4px; color: var(--accent); }
  .lead { color: var(--dim); margin: 0 0 12px; }
  .bar { position: sticky; top: 0; z-index: 2; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .bar span { flex: 1 1 200px; color: var(--dim); }
  h2 { font-weight: 700; font-size: 17px; margin: 18px 0 8px; color: var(--dim); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  button { font: 700 14px "AlkiFairy", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: var(--fg); background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 10px; text-align: left; cursor: pointer; min-height: 52px; }
  button small { display: block; font-weight: 500; font-size: 11px; color: var(--dim); margin-top: 2px; }
  button:active, button.on { border-color: var(--accent); background: #26342b; }
  button.new { border-color: var(--purple); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
</style>
</head>
<body>
<main>
  <h1>🔊 봉인의 숲 사운드 테스트</h1>
  <p class="lead">게임에서 쓰는 효과음을 그대로 들어 볼 수 있어요. 버튼을 누르면 소리가 나요. (휴대폰 무음 모드면 안 들려요)</p>
  <div class="bar"><span id="msg">버튼을 눌러 보세요</span></div>
  <div id="list"></div>
</main>
<script>
  // 게임 효과음 코드가 쓰는 설정만 흉내 낸다 (효과음 켬)
  window.Input = { settings: { sfx: true } };
</script>
<script src="js/retro-sfx.js"></script>
<script src="js/sfx-cands.js"></script>
<script src="js/sfx.js"></script>
<script>
  const GROUPS = [
    ['비교: 마법봉 충전 · 마법진 (헷갈리던 소리)', [
      ['charged', '충전 완료', '차지를 다 모았을 때 (높은 삑)'],
      ['staff.cast', '마법진 깔기', '마법진을 놓을 때 (새 소리, 낮게 울림)', true],
    ]],
    ['공격', [
      ['swing', '휘두르기', '기본공격', [false]], ['swing', '마무리 휘두르기', '3타째', [true]],
      ['thrust', '찌르기', '창'], ['spin', '회전베기', '검 차지'], ['lunge', '돌진', '대시 공격 · 방패 돌진'],
      ['slam', '내려찍기', '방패 강타 · 후려치기'], ['wave', '검기', '섬광 검기', [false]], ['wave', '삼연 검기', '3타 직후 특수', [true]],
      ['orb', '마력탄', '마법봉 특수'], ['boom', '폭발', '마법진 · 덫 · 폭발 화살'],
    ]],
    ['맞히기 · 막기', [
      ['hit', '타격', '보통', [false]], ['hit', '치명타', '크리티컬', [true]], ['kill', '처치', '마물 쓰러뜨림'],
      ['block', '막기', '방패 · 받아치기'], ['guardBreak', '가드 브레이크', '방패병 깨기'],
      ['zap', '번개', '감전 · 최대 충전'], ['freeze', '빙결', '얼음 껍질 (2026-10-23 바꿈)'], ['shatter', '깨짐', '얼음 깨짐'],
    ]],
    ['몸 · 회피', [
      ['dash', '대시', ''], ['dodge', '저스트 회피', '공격 직전 대시'], ['hurt', '피격', '내가 맞음'], ['heal', '회복', ''],
    ]],
    ['진행 · 메뉴', [
      ['pickup', '고르기 · 줍기', '메뉴 이동'], ['level', '강화 · 레벨업', ''], ['boon', '축복 선택', ''],
      ['totem', '봉인석 파괴', ''], ['roar', '보스 포효', ''], ['clear', '클리어', ''],
      ['giftRise', '정령의 선물 (내려옴)', ''], ['giftOpen', '정령의 선물 (열림)', ''],
    ]],
  ];
  const list = document.getElementById('list'), msg = document.getElementById('msg');
  for (const [title, items] of GROUPS) {
    const h = document.createElement('h2'); h.textContent = title; list.appendChild(h);
    const g = document.createElement('div'); g.className = title.startsWith('비교') ? 'pair' : 'grid'; list.appendChild(g);
    for (const [key, name, note, args, isNew] of items.map(it => (it[3] === true ? [it[0], it[1], it[2], [], true] : it))) {
      const b = document.createElement('button');
      if (isNew) b.className = 'new';
      b.innerHTML = `${name}<small>${note || ''}</small>`;
      b.addEventListener('click', () => {
        const fn = Sfx[key];
        if (typeof fn !== 'function') { msg.textContent = `'${name}' 소리를 찾을 수 없어요`; return; }
        setTimeout(() => { fn(...(args || [])); }, 30); // 첫 터치에 소리 장치가 켜질 시간을 조금 준다
        msg.textContent = `▶ ${name}`;
        b.classList.add('on'); setTimeout(() => b.classList.remove('on'), 250);
      });
      g.appendChild(b);
    }
  }
</script>
</body>
</html>
